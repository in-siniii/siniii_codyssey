<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화 티어리스트</title>

  <style>
    /* ===== 기본 설정 ===== */
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 16px;
    }

    /* ===== 등급 줄 ===== */
    .tier-row {
      display: flex;
      border: 1px solid #999;
      margin-bottom: 4px;
      min-height: 60px;
    }

    /* 왼쪽 등급 이름 (S, A, B, C, D) */
    .tier-name {
      width: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      background: #eee;
      border-right: 1px solid #999;
    }

    /* 영화 카드가 들어가는 칸 */
    .tier-box {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
      cursor: pointer;
    }

    /* ===== 대기 칸 ===== */
    #pool {
      border: 1px dashed #999;
      min-height: 60px;
    }

    /* ===== 영화 카드 ===== */
    .card {
      border: 2px solid #ccc;
      background: #fff;
      padding: 6px 10px;
      cursor: pointer;
    }

    /* 선택된 카드는 테두리로 표시 */
    .card.selected {
      border-color: blue;
    }

    .delete-btn {
      margin-left: 6px;
      cursor: pointer;
    }

    /* ===== 영화 추가, 초기화 ===== */
    .add-area {
      margin-top: 16px;
    }

    #reset-btn {
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <h1>영화 티어리스트</h1>
  <p>영화를 누른 다음, 넣고 싶은 등급 칸을 누르세요.</p>

  <!-- 1. 등급 칸 5개 -->
  <div class="tier-row">
    <div class="tier-name">S</div>
    <div class="tier-box" id="tier-S"></div>
  </div>
  <div class="tier-row">
    <div class="tier-name">A</div>
    <div class="tier-box" id="tier-A"></div>
  </div>
  <div class="tier-row">
    <div class="tier-name">B</div>
    <div class="tier-box" id="tier-B"></div>
  </div>
  <div class="tier-row">
    <div class="tier-name">C</div>
    <div class="tier-box" id="tier-C"></div>
  </div>
  <div class="tier-row">
    <div class="tier-name">D</div>
    <div class="tier-box" id="tier-D"></div>
  </div>

  <!-- 2. 대기 칸 -->
  <h2>대기 칸</h2>
  <div class="tier-box" id="pool"></div>

  <!-- 3. 영화 추가 -->
  <div class="add-area">
    <input type="text" id="title-input" placeholder="영화 제목을 입력하세요">
    <button id="add-btn">추가</button>
  </div>

  <!-- 4. 초기화 -->
  <button id="reset-btn">초기화</button>

  <script>
    // ===== 1. 데이터 =====
    // 영화 하나는 { id: 번호, title: 제목, tier: 들어있는 칸 } 모양
    // tier 값: "S", "A", "B", "C", "D", 또는 "pool"(대기 칸)

    const defaultTitles = [
      "기생충",
      "인터스텔라",
      "라라랜드",
      "센과 치히로의 행방불명",
      "어벤져스: 엔드게임",
      "범죄도시",
      "타이타닉",
      "토이 스토리"
    ];

    let movies = [];          // 모든 영화 목록
    let selectedId = null;    // 지금 선택된 영화의 id (없으면 null)


    // ===== 2. 저장하기 / 불러오기 =====
    // localStorage: 브라우저에 작은 메모를 남겨두는 기능

    function saveMovies() {
      localStorage.setItem("movies", JSON.stringify(movies));
    }

    function loadMovies() {
      const saved = localStorage.getItem("movies");

      if (saved) {
        // 저장된 게 있으면 그걸 불러온다
        movies = JSON.parse(saved);
      } else {
        // 처음 열었으면 기본 영화 8편을 대기 칸에 넣는다
        movies = defaultTitles.map(function (title, index) {
          return { id: index, title: title, tier: "pool" };
        });
      }
    }


    // ===== 3. 화면 그리기 =====
    // movies 목록을 보고 카드를 알맞은 칸에 넣는다

    function render() {
      // 모든 칸을 먼저 비운다
      const boxIds = ["tier-S", "tier-A", "tier-B", "tier-C", "tier-D", "pool"];
      boxIds.forEach(function (boxId) {
        document.getElementById(boxId).innerHTML = "";
      });

      // 영화마다 카드를 만들어서 칸에 넣는다
      movies.forEach(function (movie) {
        const card = document.createElement("div");
        card.className = "card";
        if (movie.id === selectedId) {
          card.classList.add("selected");
        }
        card.textContent = movie.title;

        // 카드를 누르면 → 이 영화를 선택
        card.onclick = function (event) {
          event.stopPropagation(); // 뒤에 있는 칸까지 눌린 걸로 처리되지 않게 막기
          selectedId = movie.id;
          render();
        };

        // 삭제 버튼
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "삭제";
        deleteBtn.onclick = function (event) {
          event.stopPropagation();
          deleteMovie(movie.id);
        };
        card.appendChild(deleteBtn);

        // 알맞은 칸 찾기
        let boxId;
        if (movie.tier === "pool") {
          boxId = "pool";
        } else {
          boxId = "tier-" + movie.tier;
        }
        document.getElementById(boxId).appendChild(card);
      });
    }


    // ===== 4. 등급 칸 누르기 → 선택된 영화 옮기기 =====

    function moveSelectedMovie(tier) {
      if (selectedId === null) {
        return; // 선택된 영화가 없으면 아무것도 안 함
      }

      movies.forEach(function (movie) {
        if (movie.id === selectedId) {
          movie.tier = tier;
        }
      });

      selectedId = null; // 옮긴 다음 선택 해제
      saveMovies();
      render();
    }

    // 각 칸에 "누르면 옮기기" 기능 연결
    ["S", "A", "B", "C", "D"].forEach(function (tier) {
      document.getElementById("tier-" + tier).onclick = function () {
        moveSelectedMovie(tier);
      };
    });
    document.getElementById("pool").onclick = function () {
      moveSelectedMovie("pool");
    };


    // ===== 5. 영화 추가 =====

    document.getElementById("add-btn").onclick = function () {
      const input = document.getElementById("title-input");

      // 같은 제목이 이미 있는지 확인
      const isDuplicate = movies.some(function (movie) {
        return movie.title === input.value;
      });

      if (isDuplicate) {
        alert("이미 있는 영화예요.");
        return; // 여기서 멈추고 추가하지 않음
      }

      movies.push({
        id: Date.now(),        // 지금 시각을 번호로 써서 겹치지 않게
        title: input.value,
        tier: "pool"
      });

      input.value = "";        // 입력칸 비우기
      saveMovies();
      render();
    };


    // ===== 6. 영화 삭제 =====

    function deleteMovie(id) {
      // 지울 영화만 빼고 나머지로 목록을 다시 만든다
      movies = movies.filter(function (movie) {
        return movie.id !== id;
      });

      if (selectedId === id) {
        selectedId = null;
      }
      saveMovies();
      render();
    }


    // ===== 7. 초기화 =====
    // 모든 영화를 대기 칸으로 돌려보낸다 (추가한 영화도 남아 있음)

    document.getElementById("reset-btn").onclick = function () {
      movies.forEach(function (movie) {
        movie.tier = "pool";
      });

      selectedId = null;
      saveMovies();
      render();
    };


    // ===== 8. 처음 시작 =====
    loadMovies();
    render();
  </script>

</body>
</html>
