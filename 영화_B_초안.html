<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화 티어리스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 20px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
      color: #222;
      background: #fff;
    }
    main { width: min(1100px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 24px; font-size: 26px; }
    h2 { margin: 0 0 10px; font-size: 17px; }
    .tiers {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }
    .tier {
      min-height: 180px;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fafafa;
    }
    .tier h2 { padding-bottom: 9px; border-bottom: 1px solid #ddd; }
    .waiting {
      min-height: 110px;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fafafa;
      margin-bottom: 22px;
    }
    .cards { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; min-height: 35px; }
    .movie-card {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 8px 9px;
      border: 1px solid #aaa;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.4;
    }
    .movie-card.selected { outline: 2px solid #222; outline-offset: 1px; }
    .movie-title { overflow-wrap: anywhere; }
    .delete-button {
      flex: 0 0 auto;
      border: 0;
      padding: 0 2px;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }
    .delete-button:hover { color: #c00; }
    .empty { color: #888; font-size: 13px; }
    .add-area { display: flex; gap: 8px; margin-bottom: 14px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font: inherit;
    }
    button.action {
      padding: 9px 16px;
      border: 1px solid #888;
      border-radius: 4px;
      background: #f5f5f5;
      color: #222;
      font: inherit;
      cursor: pointer;
    }
    button.action:hover { background: #e9e9e9; }
    .reset-row { display: flex; justify-content: flex-end; }
    .hint { margin: 0 0 14px; color: #666; font-size: 13px; }
    #message { min-height: 20px; margin: 0 0 10px; color: #a22; font-size: 13px; }
    @media (max-width: 700px) {
      body { padding: 20px 12px 32px; }
      .tiers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tier:last-child { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>영화 티어리스트</h1>

    <section class="tiers" aria-label="영화 등급">
      <div class="tier" data-tier="S"><h2>S</h2><div class="cards"></div></div>
      <div class="tier" data-tier="A"><h2>A</h2><div class="cards"></div></div>
      <div class="tier" data-tier="B"><h2>B</h2><div class="cards"></div></div>
      <div class="tier" data-tier="C"><h2>C</h2><div class="cards"></div></div>
      <div class="tier" data-tier="D"><h2>D</h2><div class="cards"></div></div>
    </section>

    <section class="waiting" data-tier="waiting" aria-label="대기 중인 영화">
      <h2>대기</h2>
      <div class="cards"></div>
    </section>

    <p class="hint">영화 카드를 선택한 다음 원하는 등급 칸을 누르세요.</p>
    <p id="message" role="status" aria-live="polite"></p>

    <form class="add-area" id="addForm">
      <input id="movieInput" type="text" placeholder="영화 제목 입력" aria-label="영화 제목" maxlength="100">
      <button class="action" type="submit">추가</button>
    </form>

    <div class="reset-row">
      <button class="action" id="resetButton" type="button">초기화</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "movie-tier-list-v1";
    const defaultMovies = [
      "기생충",
      "인터스텔라",
      "라라랜드",
      "센과 치히로의 행방불명",
      "어벤져스: 엔드게임",
      "범죄도시",
      "타이타닉",
      "토이 스토리"
    ];

    let movies = loadMovies();
    let selectedId = null;

    function loadMovies() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved !== null) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            return parsed.filter(movie =>
              movie && typeof movie.id === "string" &&
              typeof movie.title === "string" &&
              ["waiting", "S", "A", "B", "C", "D"].includes(movie.tier)
            );
          }
        }
      } catch (error) {
        console.warn("저장된 영화 목록을 불러오지 못했습니다.", error);
      }
      return defaultMovies.map((title, index) => ({
        id: "default-" + index,
        title,
        tier: "waiting"
      }));
    }

    function saveMovies() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
      } catch (error) {
        showMessage("브라우저에 저장하지 못했습니다. 저장 공간이나 브라우저 설정을 확인하세요.");
      }
    }

    function showMessage(message = "") {
      document.getElementById("message").textContent = message;
    }

    function createCard(movie) {
      const card = document.createElement("div");
      card.className = "movie-card" + (movie.id === selectedId ? " selected" : "");
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.setAttribute("aria-pressed", movie.id === selectedId ? "true" : "false");

      const title = document.createElement("span");
      title.className = "movie-title";
      title.textContent = movie.title;

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.type = "button";
      deleteButton.textContent = "×";
      deleteButton.setAttribute("aria-label", movie.title + " 삭제");
      deleteButton.addEventListener("click", event => {
        event.stopPropagation();
        movies = movies.filter(item => item.id !== movie.id);
        if (selectedId === movie.id) selectedId = null;
        saveMovies();
        render();
        showMessage("");
      });

      const selectCard = () => {
        selectedId = selectedId === movie.id ? null : movie.id;
        showMessage("");
        render();
      };

      card.addEventListener("click", selectCard);
      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectCard();
        }
      });

      card.append(title, deleteButton);
      return card;
    }

    function render() {
      document.querySelectorAll("[data-tier]").forEach(section => {
        const tier = section.dataset.tier;
        const cards = section.querySelector(".cards");
        cards.replaceChildren();

        const matchingMovies = movies.filter(movie => movie.tier === tier);
        if (matchingMovies.length === 0) {
          const empty = document.createElement("span");
          empty.className = "empty";
          empty.textContent = "영화 없음";
          cards.appendChild(empty);
        } else {
          matchingMovies.forEach(movie => cards.appendChild(createCard(movie)));
        }

        if (tier !== "waiting") {
          section.onclick = event => {
            if (event.target.closest(".movie-card")) return;
            moveSelectedMovie(tier);
          };
          section.style.cursor = selectedId ? "pointer" : "default";
        } else {
          section.onclick = event => {
            if (event.target.closest(".movie-card")) return;
            moveSelectedMovie("waiting");
          };
          section.style.cursor = selectedId ? "pointer" : "default";
        }
      });
    }

    function moveSelectedMovie(tier) {
      if (!selectedId) return;
      const movie = movies.find(item => item.id === selectedId);
      if (!movie) return;
      movie.tier = tier;
      selectedId = null;
      saveMovies();
      render();
      showMessage("");
    }

    document.getElementById("addForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = document.getElementById("movieInput");
      const title = input.value.trim();
      if (!title) {
        showMessage("영화 제목을 입력하세요.");
        input.focus();
        return;
      }
      const duplicate = movies.some(movie =>
        movie.title.trim().toLocaleLowerCase() === title.toLocaleLowerCase()
      );
      if (duplicate) {
        showMessage("이미 추가된 영화입니다.");
        input.focus();
        return;
      }
      movies.push({
        id: "movie-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
        title,
        tier: "waiting"
      });
      selectedId = null;
      saveMovies();
      render();
      input.value = "";
      showMessage("");
      input.focus();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      movies.forEach(movie => movie.tier = "waiting");
      selectedId = null;
      saveMovies();
      render();
      showMessage("");
    });

    render();
  </script>
</body>
</html>
