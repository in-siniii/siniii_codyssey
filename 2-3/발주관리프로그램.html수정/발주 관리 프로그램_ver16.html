<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1 class="title"><button type="button" class="store-name-btn" id="storeNameBtn" title="눌러서 매장 이름 바꾸기"><span id="storeNameText">매장</span></button><input id="storeNameInput" maxlength="12" placeholder="매장 이름" aria-label="매장 이름" hidden /><span>재고·발주 관리</span><span class="store-actions" id="storeActions" hidden><button type="button" class="primary" id="storeOk">확인</button><button type="button" id="storeCancel">취소</button></span></h1><p>재고를 확인하고 필요한 품목을 발주하세요.</p></div>
    <div class="top-bar">
    <nav class="nav" aria-label="주 메뉴">
      <button class="active" data-view="inventory">재고 목록</button>
      <button data-view="orders">발주 필요 <span id="needCount"></span></button>
      <button data-view="history">발주 기록</button>
      <button data-view="register">품목 등록</button>
    </nav>
    <div class="top-right" id="saveArea"><button class="save-btn" id="saveBtn">저장</button></div>
    </div>
  </header>

  <main>
    <section class="view active panel" id="view-inventory">
      <div class="section-head"><div><h2>재고 목록</h2><p>현재 보유한 품목과 수량을 확인하고 관리합니다.</p></div></div>
      <div class="toolbar">
        <div class="search"><input id="searchInput" type="search" placeholder="품목명 검색" autocomplete="off" /></div>
        <div class="view-switch" aria-label="보기 방식"><button class="active" data-mode="all">전체 보기</button><button data-mode="supplier">거래처별 보기</button><button data-mode="category">분류별 보기</button></div>
      </div>
      <div id="inventoryTable" class="table-wrap"></div><div id="inventoryCards" class="cards"></div>
      <div class="pagination" id="pagination" aria-label="페이지 이동"></div>
    </section>

    <section class="view panel" id="view-register">
      <div class="section-head"><div><h2>품목 등록</h2><p>새로 관리할 식재료 또는 공산품 정보를 입력하세요.</p></div></div>
      <form id="registerForm" novalidate>
        <div class="form-grid">

    if(orderMode==='all')return [{title:'',items:list}];
    const key=orderMode==='supplier'?'supplier':'category';const g=i=>i[key]||'미분류';
    const titles=[...new Set(list.map(g))].sort((a,b)=>key==='category'?(catRank(a)-catRank(b))||a.localeCompare(b,'ko'):a.localeCompare(b,'ko'));
    return titles.map(t=>({title:t,items:list.filter(i=>g(i)===t)}));
  }
  function renderOrders(){
    const list=orderListItems();
    const card=i=>{
      const isLow=low(i),has=!!i.bundleUnit,o=currentAmount(i);
      const nowText=has?`${qtyText(i)} (총 ${fmt(total(i))}${i.eachUnit})`:qtyText(i);
      const reqText=has?`${splitTxt(i,i.required)} (총 ${fmt(i.required)}${i.eachUnit})`:`${fmt(i.required)}${i.eachUnit}`;
      const row=(part,val,unit,dec)=>`<div class="oa-row"><input type="text" class="num-input" ${dec?'data-decimal="1" inputmode="decimal"':'inputmode="numeric"'} data-order-qty="${i.id}" data-part="${part}" value="${escapeHtml(val)}" placeholder="0" aria-label="${escapeHtml(i.name)} 발주 수량 (${escapeHtml(unit)})" /><span class="oa-unit">${escapeHtml(unit)}</span></div>`;
      return `<article class="order-item ${isLow?'need':'manual'}"><div><h3>${escapeHtml(i.name)} <span class="pill">${escapeHtml(i.supplier)}</span>${isLow?'':'<span class="pill manual-pill">직접 추가</span>'}</h3>
        <div class="detail">현재 ${escapeHtml(nowText)} / 필요 ${escapeHtml(reqText)}</div></div>
        <div class="order-amount"><span class="oa-label">발주 수량</span><div class="oa-inputs">${has?row('b',o.b,i.bundleUnit,false):''}${row('e',o.e,i.eachUnit,true)}${has?`<div class="oa-total" id="oa-total-${i.id}">= 총 ${fmt(amountOf(i,o))}${escapeHtml(i.eachUnit)}</div>`:''}</div></div>
        <div class="order-note">${noteHtml(i)}</div>
        <div class="order-remove"><button type="button" class="remove-manual" data-remove-order="${i.id}">목록에서 빼기</button></div></article>`;
    };
    const html=orderMode==='all'?list.map(card).join(''):orderGroups(list).map(g=>`<section class="order-group"><div class="order-group-name">${escapeHtml(g.title)}<span class="pill">${g.items.length}개</span></div><div class="order-group-items">${g.items.map(card).join('')}</div></section>`).join('');
    $('orderList').innerHTML=list.length?html:'<div class="empty"><strong>발주가 필요한 품목이 없습니다.</strong>필요한 품목은 위에서 직접 추가할 수 있습니다.</div>';
    $('orderBottom').hidden=!list.length;$('orderMemoWrap').hidden=!list.length;$('orderMessage').textContent='';
  }
  $('orderList').addEventListener('focusout',e=>{const el=e.target;if(!el.dataset||!el.dataset.note||el.value.trim()!=='')return;const id=Number(el.dataset.note),it=state.items.find(i=>i.id===id);openNotes.delete(id);delete orderNotes[id];if(it)el.parentElement.innerHTML=noteBtn(it);});
  document.querySelectorAll('[data-omode]').forEach(b=>b.addEventListener('click',()=>{orderMode=b.dataset.omode;document.querySelectorAll('[data-omode]').forEach(x=>x.classList.toggle('active',x===b));renderOrders();}));
  $('orderList').addEventListener('input',e=>{const el=e.target;if(el.dataset.note){orderNotes[el.dataset.note]=el.value;return;}if(!el.dataset.orderQty)return;
    el.value=cleanNumber(el.value,el.dataset.decimal==='1');
    const i=state.items.find(x=>x.id===Number(el.dataset.orderQty));if(!i)return;
    const cur={...currentAmount(i)};cur[el.dataset.part]=el.value;cur.sig=orderSig(i);orderInputs[i.id]=cur;
    const t=$('oa-total-'+i.id);if(t)t.textContent=`= 총 ${fmt(amountOf(i,cur))}${i.eachUnit}`;});
  $('orderList').addEventListener('click',e=>{const nb=e.target.closest('[data-note-open]');if(nb){const id=Number(nb.dataset.noteOpen),it=state.items.find(i=>i.id===id);if(!it)return;openNotes.add(id);nb.parentElement.innerHTML=noteInput(it);$('orderList').querySelector(`[data-note="${id}"]`).focus();return;}const b=e.target.closest('[data-remove-order]');if(!b)return;const id=Number(b.dataset.removeOrder);const it=state.items.find(i=>i.id===id);manualOrderIds.delete(id);if(it&&low(it))excludedIds.add(id);delete orderInputs[id];delete orderNotes[id];openNotes.delete(id);renderOrders();toast('목록에서 뺐습니다. 위의 직접 추가로 다시 넣을 수 있어요.');});

  // 직접 추가: 품목명 검색 → 고르기
  function renderAddList(){const q=$('orderAddInput').value.trim().toLowerCase();const inList=new Set(orderListItems().map(i=>i.id));
    const cands=state.items.filter(i=>!inList.has(i.id)&&i.name.toLowerCase().includes(q)).sort(byName);
    $('orderAddList').innerHTML=cands.length?cands.map(i=>`<li class="dd-opt" role="option" tabindex="0" data-add="${i.id}"><span>${escapeHtml(i.name)}</span><small>현재 ${escapeHtml(qtyText(i))} · ${escapeHtml(i.supplier)}</small></li>`).join(''):'<li class="dd-empty">추가할 수 있는 품목이 없습니다</li>';
    $('orderAddList').hidden=false;}
  $('orderAddInput').addEventListener('focus',renderAddList);
  $('orderAddInput').addEventListener('input',renderAddList);
  $('orderAddList').addEventListener('click',e=>{const li=e.target.closest('[data-add]');if(!li)return;const addId=Number(li.dataset.add);excludedIds.delete(addId);manualOrderIds.delete(addId);manualOrderIds.add(addId);$('orderAddInput').value='';$('orderAddList').hidden=true;renderOrders();toast('발주 목록에 추가했습니다.');});
  $('orderAddList').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.add){e.preventDefault();e.target.click();}});
  document.addEventListener('click',e=>{if(!e.target.closest('.order-add'))$('orderAddList').hidden=true;});

  function orderError(msg){$('orderMessage').textContent=msg;$('orderMessage').classList.add('error');}
  $('completeOrder').addEventListener('click',()=>{const buyer=$('buyerName').value.trim();if(!buyer)return orderError('발주자 이름을 입력해 주세요.');
    const list=orderListItems();if(!list.length){renderOrders();return;}
    const orders=[];
    for(const item of list){const o=currentAmount(item);const b=item.bundleUnit?Number(o.b||0):0,e=Number(o.e||0);
      if(!Number.isFinite(b)||!Number.isFinite(e)||b<0||e<0)return orderError('발주 수량을 숫자로 입력해 주세요.');
      if(b>0||e>0)orders.push({item,b,e});}
    if(!orders.length)return orderError('발주 수량을 입력해 주세요.');
    const now=new Date();const record={date:now.toLocaleDateString('ko-KR'),time:now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),buyer,memo:$('orderMemo').value.trim(),items:[]};
    orders.forEach(({item,b,e})=>{const amount=amountOf(item,{b,e});let split='';
      if(item.bundleUnit){
        item.bundleQty+=b;item.eachQty=Number((item.eachQty+e).toFixed(6));
        // 낱개가 묶음 하나 이상 쌓이면 묶음으로 올리기 (예: 1판 30개)
        const up=Math.floor((item.eachQty+1e-9)/item.bundleSize);if(up>0){item.bundleQty+=up;item.eachQty=Number((item.eachQty-up*item.bundleSize).toFixed(6));}
        split=`${fmt(b)}${item.bundleUnit} ${fmt(e)}${item.eachUnit}`;
      }else item.eachQty=Number((item.eachQty+amount).toFixed(6));
      record.items.push({name:item.name,amount,unit:item.eachUnit,supplier:item.supplier,split,note:(orderNotes[item.id]||'').trim()});});
    state.history.unshift(record);historyPage=1;manualOrderIds.clear();excludedIds.clear();orderInputs={};orderNotes={};openNotes.clear();$('orderMemo').value='';persist();
    $('buyerName').value='';renderInventory();renderOrders();renderHistory();toast('발주가 완료되고 재고 및 기록이 저장되었습니다.');});
  let historyPage=1;const HIST_SIZE=10;
  function renderHistory(){
    if(!state.history.length){$('historyList').innerHTML='<div class="empty"><strong>발주 기록이 없습니다.</strong>발주를 완료하면 이곳에 내역이 쌓입니다.</div>';$('historyPagination').innerHTML='';return;}
    const totalPages=Math.max(1,Math.ceil(state.history.length/HIST_SIZE));if(historyPage>totalPages)historyPage=totalPages;
    const rows=state.history.slice((historyPage-1)*HIST_SIZE,historyPage*HIST_SIZE);
    const groupBySup=r=>{const m=new Map();r.items.forEach(i=>{const k=i.supplier||'거래처 정보 없음';if(!m.has(k))m.set(k,[]);m.get(k).push(i);});return [...m];};
    const itemText=i=>`${escapeHtml(i.name)} · ${fmt(i.amount)}${escapeHtml(i.unit)}${i.split?` (${escapeHtml(i.split)})`:''}`;
    const memoHtml=r=>escapeHtml(r.memo).replace(/\n/g,'<br>');
    // 컴퓨터: 품목 한 줄씩, 날짜·시간·발주자·거래처는 칸 합치기
    const table=rows.map(r=>{const groups=groupBySup(r);const n=r.items.length;let first=true,h='';
      groups.forEach(([sup,its])=>its.forEach((i,idx)=>{
        h+='<tr>'+(first?`<td rowspan="${n}">${escapeHtml(r.date)}</td><td rowspan="${n}">${escapeHtml(r.time)}</td><td rowspan="${n}">${escapeHtml(r.buyer)}</td>`:'')
          +(idx===0?`<td class="h-sup" rowspan="${its.length}">${escapeHtml(sup)}</td>`:'')
          +`<td class="h-item">${itemText(i)}</td><td class="h-note">${i.note?escapeHtml(i.note):''}</td></tr>`;first=false;}));
      if(r.memo)h+=`<tr class="memo-row"><td colspan="6"><span class="memo-label">메모</span>${memoHtml(r)}</td></tr>`;
      return `<tbody class="hist-rec">${h}</tbody>`;}).join('<tbody class="hist-gap" aria-hidden="true"><tr><td colspan="6"></td></tr></tbody>');
    // 휴대폰: 발주 한 건 = 카드 하나
    const cards=rows.map(r=>`<article class="hist-card"><div class="hist-card-top"><strong>${escapeHtml(r.buyer)}</strong><span>${escapeHtml(r.date)} ${escapeHtml(r.time)}</span></div>${groupBySup(r).map(([sup,its])=>`<div class="hist-sup"><span class="pill sup-pill">${escapeHtml(sup)}</span><ul>${its.map(i=>`<li><span>${itemText(i)}</span>${i.note?`<span class="hist-note">특이사항: ${escapeHtml(i.note)}</span>`:''}</li>`).join('')}</ul></div>`).join('')}${r.memo?`<div class="hist-card-memo"><span class="memo-label">메모</span>${memoHtml(r)}</div>`:''}</article>`).join('');
    $('historyList').innerHTML=`<div class="hist-wrap"><table class="hist"><thead><tr><th>발주 날짜</th><th>발주 시간</th><th>발주자</th><th>거래처</th><th>발주 품목 및 수량</th><th>특이사항</th></tr></thead>${table}</table></div><div class="hist-cards">${cards}</div>`;
    renderPagination(totalPages,historyPage,'historyPagination');
  }
  $('historyPagination').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b||b.disabled)return;historyPage=Number(b.dataset.page);renderHistory();$('view-history').scrollIntoView({behavior:'smooth',block:'start'});});
  $('saveBtn').addEventListener('click',()=>{try{persist();toast('저장되었습니다.');}catch(e){toast('저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.');}});
  // 제목의 '매장' 부분 바꾸기 (확인하면 바로 저장)
  const STORE_KEY='food-order-manager-store-name';
  let storeName='매장';
  try{storeName=localStorage.getItem(STORE_KEY)||'매장';}catch(e){}
  function renderTitle(){$('storeNameText').textContent=storeName;document.title=`${storeName} 재고·발주 관리`;}
  function setStoreEditing(on){$('storeNameBtn').hidden=on;$('storeNameInput').hidden=!on;$('storeActions').hidden=!on;if(on){$('storeNameInput').value=storeName;$('storeNameInput').focus();$('storeNameInput').select();}}
  function confirmStoreName(){storeName=$('storeNameInput').value.trim().slice(0,12)||'매장';try{localStorage.setItem(STORE_KEY,storeName);}catch(e){}renderTitle();setStoreEditing(false);toast('매장 이름이 저장되었습니다.');}
  $('storeNameBtn').addEventListener('click',()=>setStoreEditing(true));
  $('storeOk').addEventListener('click',confirmStoreName);
  $('storeCancel').addEventListener('click',()=>setStoreEditing(false));
  $('storeNameInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();confirmStoreName();}else if(e.key==='Escape')setStoreEditing(false);});
  renderTitle();
  renderInventory();renderOrders();renderHistory();
})();
</script>
</body>
</html>
