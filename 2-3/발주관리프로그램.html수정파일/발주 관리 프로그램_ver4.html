@media(max-width:480px){body{font-size:13px}.app{padding:14px 11px 35px}.brand h1{font-size:21px}.brand p{font-size:11px}.top-bar{flex-direction:column;align-items:stretch;gap:8px}.top-right{align-self:flex-end}.nav{overflow:visible;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}#storeNameInput{font-size:17px;width:8em}.page-btn{min-width:36px;height:40px}.nav button{padding:10px 3px;font-size:11px}.save-btn{padding:9px 13px;font-size:12px}.panel{padding:18px;border-radius:12px}.section-head h2{font-size:17px}.section-head p{font-size:11px}.toolbar{gap:7px}.search{flex-basis:100%}.view-switch{width:100%;justify-content:space-between}.view-switch button{flex:1;padding:8px 4px;font-size:11px}.stock-card{padding:12px 10px;gap:8px}.card-main .item-name{font-size:14px}.card-qty{font-size:17px}.card-controls{min-width:98px}.card-controls .stepper span{font-size:12px}.card-controls .stepper button{width:27px;height:28px}.card-meta{font-size:11px}.form-grid{grid-template-columns:1fr;gap:13px}.form-bottom{align-items:stretch;flex-direction:column-reverse}.form-bottom button{width:100%;padding:12px}.notice{text-align:right}.order-item{grid-template-columns:1fr;gap:12px;padding:13px}.order-amount{justify-content:flex-start}.order-bottom{align-items:stretch;flex-direction:column}.buyer{min-width:0}.order-actions{justify-content:space-between}.order-actions button{flex:1}.history-top{align-items:flex-start;flex-direction:column;gap:4px}}

<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1 class="title"><button type="button" class="store-name-btn" id="storeNameBtn" title="눌러서 매장 이름 바꾸기"><span id="storeNameText">매장</span></button><input id="storeNameInput" maxlength="12" placeholder="매장 이름" aria-label="매장 이름" hidden /><span>재고·발주 관리</span><span class="store-actions" id="storeActions" hidden><button type="button" class="primary" id="storeOk">확인</button><button type="button" id="storeCancel">취소</button></span></h1><p>재고를 확인하고 필요한 품목을 발주하세요.</p></div>
    <div class="top-bar">
    <nav class="nav" aria-label="주 메뉴">
      <button class="active" data-view="inventory">재고 목록</button>
      <button data-view="register">품목 등록</button>
      <button data-view="orders">발주 필요 <span id="needCount"></span></button>
      <button data-view="history">발주 기록</button>
    </nav>
    <div class="top-right" id="saveArea"><button class="save-btn" id="saveBtn">저장</button></div>
    </div>
  </header>

  <main>
    <section class="view active panel" id="view-inventory">
      <div class="section-head"><div><h2>재고 목록</h2><p>현재 보유한 품목과 수량을 확인하고 관리합니다.</p></div></div>
      <div class="toolbar">
        <div class="search"><input id="searchInput" type="search" placeholder="품목명 검색" autocomplete="off" /></div>
        <div class="view-switch" aria-label="보기 방식"><button class="active" data-mode="all">전체 보기</button><button data-mode="supplier">거래처별 보기</button><button data-mode="category">분류별 보기</button></div>
      </div>
      <div id="inventoryTable" class="table-wrap"></div><div id="inventoryCards" class="cards"></div>
      <div class="pagination" id="pagination" aria-label="페이지 이동"></div>
    </section>

    <section class="view panel" id="view-register">
      <div class="section-head"><div><h2>품목 등록</h2><p>새로 관리할 식재료 또는 공산품 정보를 입력하세요.</p></div></div>
      <form id="registerForm">
        <div class="form-grid">
          <div class="field"><label for="itemName">품목명 *</label><input id="itemName" required placeholder="예: 양파" /></div>
          <div class="field"><label for="category">분류 *</label><select id="category" required><option value="">분류 선택</option><option>채소</option><option>육류</option><option>수산</option><option>유제품</option><option>양념</option><option>공산품</option><option>기타</option></select></div>
          <div class="field"><label for="supplier">거래처 *</label><input id="supplier" required placeholder="예: 다온식자재" /></div>
          <div class="field"><label for="bundleUnit">묶음 단위</label><select id="bundleUnit"><option value="">없음</option><option>박스</option><option>판</option><option>봉지</option><option>팩</option><option>통</option><option>묶음</option><option value="custom">직접입력</option></select><div class="unit-row" id="bundleCustomWrap" hidden><input id="bundleCustom" placeholder="묶음 단위 입력" /></div></div>
          <div class="field"><label for="eachUnit">낱개 단위 *</label><select id="eachUnit" required><option value="">단위 선택</option><option>개</option><option>kg</option><option>g</option><option>L</option><option>박스</option><option>판</option><option>봉지</option><option>팩</option><option>통</option><option>묶음</option><option value="custom">직접입력</option></select><div class="unit-row" id="eachCustomWrap" hidden><input id="eachCustom" placeholder="낱개 단위 입력" /></div></div>
          <div class="field" id="bundleSizeField" hidden><label for="bundleSize">묶음당 낱개 수 *</label><input id="bundleSize" type="number" min="1" step="1" placeholder="예: 30" /></div>
          <div class="field" id="bundleQtyField" hidden><label for="bundleQty">현재 묶음 수량 *</label><input id="bundleQty" type="number" min="0" step="1" placeholder="예: 2" /></div>
          <div class="field"><label for="eachQty">현재 낱개 수량 *</label><input id="eachQty" type="number" min="0" step="any" placeholder="예: 5" required /></div>
          <div class="field"><label for="requiredQty">필요 수량 (낱개 기준) *</label><input id="requiredQty" type="number" min="0" step="any" placeholder="예: 90" required /></div>
        </div>
        <div class="form-bottom"><span class="notice" id="registerMessage">* 표시된 항목을 모두 입력해 주세요.</span><button class="primary" type="submit">등록</button></div>
      </form>
    </section>

    <section class="view panel" id="view-orders">
      <div class="section-head"><div><h2>발주 필요 목록</h2><p>필요 수량보다 재고가 적은 품목입니다. 발주 수량은 직접 수정할 수 있습니다.</p></div></div>
      <div id="orderList" class="order-list"></div>
      <div class="order-bottom" id="orderBottom" hidden>
        <div class="buyer"><label for="buyerName">발주자 이름 *</label><input id="buyerName" placeholder="발주한 사람 이름" /></div>
        <div class="order-actions"><span class="notice" id="orderMessage"></span><button class="primary" id="completeOrder">발주 완료</button></div>
      </div>
    </section>

    <section class="view panel" id="view-history">
      <div class="section-head"><div><h2>발주 기록</h2><p>완료한 발주 내역을 최근 순서대로 확인합니다.</p></div></div>
      <div id="historyList"></div>
    </section>
  </main>
</div>
<div class="modal-backdrop" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="modal"><h3 id="editTitle">품목 수정</h3><div class="field" id="editBundleQtyField"><label for="editBundleQty" id="editBundleQtyLabel">현재 묶음 수량</label><input id="editBundleQty" type="number" min="0" step="1" /></div><div class="field"><label for="editEachQty" id="editEachQtyLabel">현재 수량</label><input id="editEachQty" type="number" min="0" step="any" /></div><div class="field"><label for="editRequired">필요 수량 (낱개 기준)</label><input id="editRequired" type="number" min="0" step="any" /></div><div class="field" id="editBundleField"><label for="editBundleSize">묶음당 낱개 수</label><input id="editBundleSize" type="number" min="1" step="1" /></div><div class="modal-actions"><button id="cancelEdit">취소</button><button class="primary" id="confirmEdit">변경 저장</button></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

  function stepLine(i,field,unit){return `<div class="qty-line"><span class="qty">${fmt(i[field])} ${escapeHtml(unit)}</span>${stepper(i.id,field)}</div>`;}
  function cardStep(i,field,unit){return `<div class="qty-line"><span>${escapeHtml(unit)}</span><div class="stepper"><button aria-label="${escapeHtml(unit)} 수량 줄이기" data-step="${i.id}" data-field="${field}" data-delta="-1">−</button><span>${fmt(i[field])}</span><button aria-label="${escapeHtml(unit)} 수량 늘리기" data-step="${i.id}" data-field="${field}" data-delta="1">＋</button></div></div>`;}
  function bindInventoryActions(){document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const item=state.items.find(i=>i.id===Number(b.dataset.step));if(!item)return;const f=b.dataset.field;item[f]=Math.max(0,Number(item[f]||0)+Number(b.dataset.delta));renderInventory();}));document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEdit(Number(b.dataset.edit))));document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.delete);const item=state.items.find(i=>i.id===id);if(!item)return;if(confirm(`'${item.name}' 품목을 삭제할까요?`)){state.items=state.items.filter(i=>i.id!==id);delete orderQuantities[id];renderInventory();renderOrders();}}));}
  $('searchInput').addEventListener('input',()=>{currentPage=1;renderInventory();});
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{viewMode=b.dataset.mode;currentPage=1;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));renderInventory();}));
  function openEdit(id){const item=state.items.find(i=>i.id===id);if(!item)return;editingId=id;
    $('editTitle').textContent=`${item.name} 수정`;
    const hasBundle=!!item.bundleUnit;
    $('editBundleQtyField').hidden=!hasBundle;$('editBundleQty').value=hasBundle?item.bundleQty:'';
    $('editBundleQtyLabel').textContent=`현재 묶음 수량 (${item.bundleUnit})`;
    $('editEachQtyLabel').textContent=hasBundle?`현재 낱개 수량 (${item.eachUnit})`:`현재 수량 (${item.eachUnit})`;
    $('editEachQty').value=item.eachQty;
    $('editRequired').value=item.required;$('editBundleField').hidden=!hasBundle;$('editBundleSize').value=item.bundleSize||'';$('editModal').classList.add('open');}
  $('cancelEdit').addEventListener('click',()=>$('editModal').classList.remove('open'));
  $('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))$('editModal').classList.remove('open');});
  $('confirmEdit').addEventListener('click',()=>{const item=state.items.find(i=>i.id===editingId);if(!item)return;
    const hasBundle=!!item.bundleUnit;
    const eachStr=$('editEachQty').value,reqStr=$('editRequired').value,bqStr=$('editBundleQty').value,sizeStr=$('editBundleSize').value;
    const each=Number(eachStr),req=Number(reqStr),bq=Number(bqStr),size=Number(sizeStr);
    const bad=eachStr===''||!Number.isFinite(each)||each<0||reqStr===''||!Number.isFinite(req)||req<0||(hasBundle&&(bqStr===''||!Number.isInteger(bq)||bq<0||sizeStr===''||!Number.isInteger(size)||size<1));
    if(bad){toast('올바른 수량을 입력해 주세요.');return;}
    item.eachQty=each;item.required=req;if(hasBundle){item.bundleQty=bq;item.bundleSize=size;}
    $('editModal').classList.remove('open');renderInventory();renderOrders();});
  function toggleCustom(selectId,wrapId,inputId){const custom=$(selectId).value==='custom';$(wrapId).hidden=!custom;if(!custom)$(inputId).value='';}
  $('bundleUnit').addEventListener('change',()=>{toggleCustom('bundleUnit','bundleCustomWrap','bundleCustom');const has=!!$('bundleUnit').value;$('bundleSizeField').hidden=!has;$('bundleQtyField').hidden=!has;if(!has){$('bundleSize').value='';$('bundleQty').value='';}});
  $('eachUnit').addEventListener('change',()=>toggleCustom('eachUnit','eachCustomWrap','eachCustom'));
  function selectedUnit(selectId,customId){return $(selectId).value==='custom'?$(customId).value.trim():$(selectId).value;}
  $('registerForm').addEventListener('submit',e=>{e.preventDefault();const bundle=$('bundleUnit').value;const bundleUnit=bundle==='custom'?$('bundleCustom').value.trim():bundle;const eachUnit=selectedUnit('eachUnit','eachCustom');const bundleSize=Number($('bundleSize').value);const bundleQty=Number($('bundleQty').value);const eachQty=Number($('eachQty').value);const required=Number($('requiredQty').value);
    const requiredFields=[$('itemName').value.trim(),$('category').value,$('supplier').value.trim(),eachUnit,$('eachQty').value,$('requiredQty').value];if(bundle){requiredFields.push(bundleUnit,$('bundleSize').value,$('bundleQty').value);}
    if(requiredFields.some(v=>v===''||v===null)||!Number.isFinite(eachQty)||eachQty<0||!Number.isFinite(required)||required<0||(bundle&&(!Number.isInteger(bundleSize)||bundleSize<1||!Number.isInteger(bundleQty)||bundleQty<0))){$('registerMessage').textContent='모든 칸을 올바르게 입력해 주세요.';$('registerMessage').classList.add('error');return;}
    const name=$('itemName').value.trim();if(state.items.some(i=>i.name.toLowerCase()===name.toLowerCase())){$('registerMessage').textContent='이미 등록된 품목 이름입니다.';$('registerMessage').classList.add('error');return;}
    state.items.push({id:state.nextId++,name,category:$('category').value,supplier:$('supplier').value.trim(),bundleUnit,eachUnit,bundleSize:bundle?bundleSize:0,bundleQty:bundle?bundleQty:0,eachQty,required});persist();$('registerForm').reset();$('bundleCustomWrap').hidden=true;$('eachCustomWrap').hidden=true;$('bundleSizeField').hidden=true;$('bundleQtyField').hidden=true;$('registerMessage').textContent='등록되었습니다. 재고 목록에 반영하고 자동 저장했습니다.';$('registerMessage').classList.remove('error');renderInventory();toast('품목이 등록되고 저장되었습니다.');showView('inventory');
  });
  function renderOrders(){const items=needed();orderQuantities={};let html='';items.forEach(i=>{const amount=Math.max(0,Number(i.required)-total(i));orderQuantities[i.id]=amount;html+=`<article class="order-item"><div><h3>${escapeHtml(i.name)} <span class="pill">${escapeHtml(i.supplier)}</span></h3><div class="detail">현재 ${escapeHtml(qtyText(i))}${i.bundleUnit?` · 총 ${fmt(total(i))}${escapeHtml(i.eachUnit)}`:''} / 필요 ${fmt(i.required)}${escapeHtml(i.eachUnit)}</div></div><div class="order-amount"><label for="order-${i.id}">발주 수량</label><input id="order-${i.id}" type="number" min="0" step="any" value="${fmt(amount)}" data-order-qty="${i.id}" /><span>${escapeHtml(i.eachUnit)}</span></div></article>`;});
    $('orderList').innerHTML=items.length?html:'<div class="empty"><strong>발주가 필요한 품목이 없습니다.</strong>현재 모든 품목의 재고가 필요 수량 이상입니다.</div>';$('orderBottom').hidden=!items.length;$('orderMessage').textContent='';
  }
  $('completeOrder').addEventListener('click',()=>{const buyer=$('buyerName').value.trim();if(!buyer){$('orderMessage').textContent='발주자 이름을 입력해 주세요.';$('orderMessage').classList.add('error');return;}const pending=needed();if(!pending.length){renderOrders();return;}const orders=[];for(const item of pending){const input=document.querySelector(`[data-order-qty="${item.id}"]`);const amount=Number(input?.value);if(!input||input.value===''||!Number.isFinite(amount)||amount<0){$('orderMessage').textContent='발주 수량을 0 이상의 숫자로 입력해 주세요.';$('orderMessage').classList.add('error');return;}orders.push({item,amount});}
    const now=new Date();const record={date:now.toLocaleDateString('ko-KR'),time:now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),buyer,items:[]};orders.forEach(({item,amount})=>{if(item.bundleUnit){const totalQty=total(item)+amount;item.bundleQty=Math.floor((totalQty+1e-9)/item.bundleSize);item.eachQty=Number((totalQty-item.bundleQty*item.bundleSize).toFixed(6));}else item.eachQty=Number((item.eachQty+amount).toFixed(6));record.items.push({name:item.name,amount,unit:item.eachUnit,supplier:item.supplier});});state.history.unshift(record);persist();$('buyerName').value='';renderInventory();renderOrders();renderHistory();toast('발주가 완료되고 재고 및 기록이 저장되었습니다.');});
  function renderHistory(){if(!state.history.length){$('historyList').innerHTML='<div class="empty"><strong>발주 기록이 없습니다.</strong>발주를 완료하면 이곳에 내역이 쌓입니다.</div>';return;}$('historyList').innerHTML=state.history.map(r=>`<article class="history-card"><div class="history-top"><strong>${escapeHtml(r.buyer)} <span class="pill">발주 완료</span></strong><time>${escapeHtml(r.date)} ${escapeHtml(r.time)}</time></div><div class="history-items">${r.items.map(i=>`${escapeHtml(i.name)} · ${fmt(i.amount)}${escapeHtml(i.unit)}`).join('<br>')}</div></article>`).join('');}
  $('saveBtn').addEventListener('click',()=>{try{persist();toast('저장되었습니다.');}catch(e){toast('저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.');}});
  // 제목의 '매장' 부분 바꾸기 (확인하면 바로 저장)
  const STORE_KEY='food-order-manager-store-name';
  let storeName='매장';
  try{storeName=localStorage.getItem(STORE_KEY)||'매장';}catch(e){}
  function renderTitle(){$('storeNameText').textContent=storeName;document.title=`${storeName} 재고·발주 관리`;}
  function setStoreEditing(on){$('storeNameBtn').hidden=on;$('storeNameInput').hidden=!on;$('storeActions').hidden=!on;if(on){$('storeNameInput').value=storeName;$('storeNameInput').focus();$('storeNameInput').select();}}
  function confirmStoreName(){storeName=$('storeNameInput').value.trim().slice(0,12)||'매장';try{localStorage.setItem(STORE_KEY,storeName);}catch(e){}renderTitle();setStoreEditing(false);toast('매장 이름이 저장되었습니다.');}
  $('storeNameBtn').addEventListener('click',()=>setStoreEditing(true));
  $('storeOk').addEventListener('click',confirmStoreName);
  $('storeCancel').addEventListener('click',()=>setStoreEditing(false));
  $('storeNameInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();confirmStoreName();}else if(e.key==='Escape')setStoreEditing(false);});
  renderTitle();
  renderInventory();renderOrders();renderHistory();
})();
</script>
</body>
</html>
